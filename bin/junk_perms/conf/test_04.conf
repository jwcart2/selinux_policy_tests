# Ordering
# Required: classes initial_sids access_vectors
# Optional: default_rules mls
# Required: te_rbac users
# Optional: Constraints
# Required: initial_sid_contexts
# Optional: fs_contexts fs_uses genfs_contexts
# Required: net_contexts
# Optional: dev_contexts ibpkey_contexts ibendport_contexts

# classes
class CLASS1
class cl01
class cl02
class cl03
class cl04
class cl05
class cl06
class cl07
class cl08
class cl09

# initial_sids
sid kernel
sid security
sid unlabeled

# access_vectors
# Commons must use "{" and "}" even if they only have one perm
common cm01 { p11a p11b p11c p11d p11e p11f p11g p11h p11i p11j p11k p11l p11m p11n p11o p11p }
common cm03 { p33a p33b p33c }

class CLASS1 { PERM1 }
class cl01 inherits cm01 { p01a p01b p01c p01d p01e p01f p01g p01h p01i p01j p01k p01l p01m p01n p01o p01p }
class cl02 { p02aa p02ab p02ac p02ad p02ae p02af p02ag p02ah p02ai p02aj p02ba p02bb p02bc p02bd p02be p02bf p02bg p02bh p02bi p02bj p02ca p02cb p02cc p02cd p02ce p02cf p02cg p02ch p02ci p02cj p02da p02db }
class cl03 inherits cm03
class cl04 { p04a p04b p04c p04d }
class cl05 { p05a p05b p05c p05d p05e }

# optional mls
sensitivity SENS1;
dominance { SENS1 }
category c01;
level SENS1;
mlsconstrain CLASS1 { PERM1 } ((h1 dom h2) and (l1 domby h1));

# te_rbac
attribute at1;
attribute at2;
attribute at3;
attribute at4;
attribute at5;

bool b01 true;

type TYPE1;
type tpx;
type tpy;
type tpz;
type tp01a;
type tp01b;
type tp02a;
type tp02b;
type tp03a;
type tp03b;
type tp04a;
type tp04b;
type tp05a;
type tp05b;

typeattribute tp01a at1;
typeattribute tp01b at1;
typeattribute tp02a at2;
typeattribute tp02b at2;
typeattribute tp03a at3;
typeattribute tp03b at3;
typeattribute tp04a at4;
typeattribute tp04b at4;
typeattribute tp05a at5;
typeattribute tp05b at5;

allow TYPE1 self : CLASS1 PERM1;

allow tp01a tpx : cl01 ~p01b;
allow tp01b tpx : cl01 { p11c p11m p01c p01m };
allow at1 tpx : cl01 { p11a p11p p01a p01p };
allow tp02a tpx : cl02 { p02aa p02ba p02ca p02db };
allow tp02b tpx : cl02 { p02ac p02bc p02cc p02da };
allow at2 tpx : cl02 ~{ p02ab p02bb p02cb p02da };
allow tp03a tpx : cl03 { p33a p33b };
allow tp03b tpx : cl03 ~p33c;
allow at3 tpx : cl03 ~p33c;
allow tp04a tpx : cl04 { p04a p04b };
allow tp04b tpx : cl04 ~{ p04c p04d }; # Invalid after optimization
allow at4 tpx : cl04 { p04a p04b };
allow tp05a tpx : cl05 ~{ p05c p05d p05e };
allow tp05b tpx : cl05 { p05c p05d p05e };
allow at5 tpx : cl05 { p05a p05b };
allow at5 tpx : cl05 ~{ p05a p05b };

auditdeny tp01a tpy : cl01 ~p01b;
auditdeny tp01b tpy : cl01 { p11c p11m p01c p01m };
auditdeny at1 tpy : cl01 { p11a p11p p01a p01p };
auditdeny tp02a tpy : cl02 { p02aa p02ba p02ca p02db };
auditdeny tp02b tpy : cl02 { p02ac p02bc p02cc p02da };
auditdeny at2 tpy : cl02 ~{ p02ab p02bb p02cb p02da };
auditdeny tp03a tpy : cl03 { p33a p33b }; # Invalid after optimization
auditdeny tp03b tpy : cl03 ~p33c;
auditdeny at3 tpy : cl03 ~p33c;
auditdeny tp04a tpy : cl04 { p04a p04b };
auditdeny tp04b tpy : cl04 ~{ p04c p04d };
auditdeny at4 tpy : cl04 { p04a p04b };
auditdeny tp05a tpy : cl05 ~{ p05c p05d p05e };
auditdeny tp05b tpy : cl05 { p05c p05d p05e };
auditdeny at5 tpy : cl05 { p05a p05b };
auditdeny at5 tpy : cl05 ~{ p05a p05b };

if (b01) {
   allow tp01a tpz : cl01 ~p01b;
   allow tp01b tpz : cl01 { p11c p11m p01c p01m };
   allow at1 tpz : cl01 { p11a p11p p01a p01p };
   allow tp02a tpz : cl02 { p02aa p02ba p02ca p02db };
   allow tp02b tpz : cl02 { p02ac p02bc p02cc p02da };
   allow at2 tpz : cl02 ~{ p02ab p02bb p02cb p02da };
   allow tp03a tpz : cl03 { p33a p33b };
   allow tp03b tpz : cl03 ~p33c;
   allow at3 tpz : cl03 ~p33c;
   allow tp04a tpz : cl04 { p04a p04b };
   allow tp04b tpz : cl04 ~{ p04c p04d }; # Invalid after optimization
   allow at4 tpz : cl04 { p04a p04b };
   allow tp05a tpz : cl05 ~{ p05c p05d p05e };
   allow tp05b tpz : cl05 { p05c p05d p05e };
   allow at5 tpz : cl05 { p05a p05b };
   allow at5 tpz : cl05 ~{ p05a p05b };
}

role ROLE1;
role ROLE1 types TYPE1;

# users
user USER1 roles ROLE1 level SENS1 range SENS1;

# optional constraints
constrain CLASS1 { PERM1 } not ((t1 == t2) and (u1 != u2));

# initial_sid_contexts
sid kernel USER1:ROLE1:TYPE1:SENS1
sid security USER1:ROLE1:TYPE1:SENS1
sid unlabeled USER1:ROLE1:TYPE1:SENS1
